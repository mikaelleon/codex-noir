<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <style>
      .spin-slow { transform-origin: 340px 340px; animation: spin 120s linear infinite; }
      .spin-slower { transform-origin: 1260px 380px; animation: spin 180s linear infinite reverse; }
      .twinkle { animation: twinkle 3.2s ease-in-out infinite; }
      .twinkle-2 { animation: twinkle 4.5s ease-in-out infinite; animation-delay: 1.2s; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes twinkle {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 1; }
      }
    </style>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C6AE72" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C6AE72" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g class="spin-slow" opacity="0.55">
    <circle cx="340" cy="340" r="120" fill="url(#sunGlow)"/>
    <circle cx="340" cy="340" r="55" fill="none" stroke="#C6AE72" stroke-width="1" opacity="0.5"/>
    <circle cx="340" cy="340" r="78" fill="none" stroke="#C6AE72" stroke-width="0.6" opacity="0.35" stroke-dasharray="2 6"/>
    <g stroke="#C6AE72" stroke-width="0.8" fill="none" opacity="0.7">
      <line x1="340" y1="180" x2="340" y2="220"/>
      <line x1="340" y1="460" x2="340" y2="500"/>
      <line x1="180" y1="340" x2="220" y2="340"/>
      <line x1="460" y1="340" x2="500" y2="340"/>
      <line x1="230" y1="230" x2="260" y2="260"/>
      <line x1="420" y1="420" x2="450" y2="450"/>
      <line x1="450" y1="230" x2="420" y2="260"/>
      <line x1="260" y1="420" x2="230" y2="450"/>
    </g>
    <g stroke="#C6AE72" stroke-width="0.7" opacity="0.45">
      <path d="M340 100 L340 160"/>
      <path d="M340 520 L340 580"/>
      <path d="M100 340 L160 340"/>
      <path d="M520 340 L580 340"/>
      <path d="M170 170 L215 215"/>
      <path d="M465 465 L510 510"/>
      <path d="M510 170 L465 215"/>
      <path d="M215 465 L170 510"/>
    </g>
    <path d="M355 310 A40 40 0 1 1 355 370 A28 28 0 1 0 355 310" fill="#2a2a2e" stroke="#C6AE72" stroke-width="0.8" opacity="0.8"/>
    <g fill="#C6AE72" stroke="#C6AE72" stroke-width="0.6">
      <circle class="twinkle" cx="200" cy="200" r="2"/>
      <circle class="twinkle-2" cx="250" cy="160" r="1.5"/>
      <circle class="twinkle" cx="280" cy="210" r="1.8"/>
      <circle class="twinkle-2" cx="160" cy="280" r="1.4"/>
      <line x1="200" y1="200" x2="250" y2="160" opacity="0.5"/>
      <line x1="250" y1="160" x2="280" y2="210" opacity="0.5"/>
      <line x1="200" y1="200" x2="160" y2="280" opacity="0.4"/>
    </g>
  </g>

  <g class="spin-slower" opacity="0.5">
    <circle cx="1260" cy="380" r="140" fill="url(#sunGlow)"/>
    <path d="M1320 300 A90 90 0 1 1 1320 460 A60 60 0 1 0 1320 300" fill="#1c1c20" stroke="#C6AE72" stroke-width="1" opacity="0.7"/>
    <circle cx="1260" cy="380" r="100" fill="none" stroke="#C6AE72" stroke-width="0.5" opacity="0.3" stroke-dasharray="3 8"/>
    <g stroke="#C6AE72" stroke-width="0.7" opacity="0.45">
      <path d="M1260 220 L1260 260"/>
      <path d="M1260 500 L1260 540"/>
      <path d="M1100 380 L1140 380"/>
      <path d="M1380 380 L1420 380"/>
      <path d="M1150 270 L1185 305"/>
      <path d="M1335 455 L1370 490"/>
    </g>
    <g fill="#C6AE72">
      <circle class="twinkle" cx="1180" cy="260" r="2"/>
      <circle class="twinkle-2" cx="1380" cy="300" r="1.5"/>
      <circle class="twinkle" cx="1400" cy="450" r="1.8"/>
      <circle class="twinkle-2" cx="1140" cy="480" r="1.3"/>
      <circle class="twinkle" cx="1450" cy="380" r="1.2"/>
    </g>
    <g transform="translate(1420 520)" stroke="#C6AE72" fill="none" stroke-width="0.8" opacity="0.7">
      <line class="twinkle" x1="0" y1="-22" x2="0" y2="22"/>
      <line class="twinkle" x1="-22" y1="0" x2="22" y2="0"/>
      <line class="twinkle-2" x1="-15" y1="-15" x2="15" y2="15"/>
      <line class="twinkle-2" x1="15" y1="-15" x2="-15" y2="15"/>
      <circle cx="0" cy="0" r="3" fill="#C6AE72"/>
    </g>
  </g>

  <g fill="none" stroke="#C6AE72" stroke-width="0.5" opacity="0.25">
    <ellipse cx="800" cy="450" rx="520" ry="220"/>
    <ellipse cx="800" cy="450" rx="420" ry="160"/>
  </g>

  <g fill="#C6AE72">
    <circle class="twinkle" cx="700" cy="120" r="1.5"/>
    <circle class="twinkle-2" cx="900" cy="180" r="1.2"/>
    <circle class="twinkle" cx="100" cy="600" r="1.4"/>
    <circle class="twinkle-2" cx="1500" cy="700" r="1.6"/>
    <circle class="twinkle" cx="800" cy="780" r="1.3"/>
    <circle class="twinkle-2" cx="500" cy="700" r="1.1"/>
  </g>
</svg>
