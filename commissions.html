<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&family=Cinzel:wght@500;600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/codex-noir.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/app-shell.css" />
  <link rel="stylesheet" href="css/commissions.css" />
  <title>Commissions — Mikaelleon</title>
</head>
<body class="shell-site" data-profile="artist">
  <div class="pf-shell pf-shell--artist pf-shell--page" data-comm-shell>
    <nav class="pf-rail" aria-label="Sections">
      <a class="pf-rail__mark" href="index.html#home" aria-label="Home">M</a>
      <a class="pf-rail-btn" href="index.html#home" aria-label="Home">
        <span class="pf-glyph" aria-hidden="true">✦</span>Home
      </a>
      <a class="pf-rail-btn" href="index.html#about" aria-label="About">
        <span class="pf-glyph" aria-hidden="true">☰</span>About
      </a>
      <a class="pf-rail-btn" href="index.html#projects" aria-label="Work">
        <span class="pf-glyph" aria-hidden="true">◆</span>Work
      </a>
      <a class="pf-rail-btn pf-rail-comm active" href="commissions.html" aria-current="page" aria-label="Commissions">
        <span class="pf-glyph" aria-hidden="true">✎</span>Commissions
      </a>
      <a class="pf-rail-btn" href="index.html#contact" aria-label="Contact">
        <span class="pf-glyph" aria-hidden="true">✉</span>Contact
      </a>
      <div class="pf-mode" role="group" aria-label="Profile mode">
        <a class="pf-mode-btn" href="index.html#home" data-mode-link="developer" aria-pressed="false">Dev</a>
        <a class="pf-mode-btn" href="commissions.html" data-mode-link="artist" aria-pressed="true">Art</a>
      </div>
    </nav>

    <div class="pf-main pf-scroll">
      <div class="pf-page commissions-page" data-comm-root>
        <header class="commissions-header">
          <nav class="breadcrumbs"><a href="index.html#home">Home</a> › <span class="current">Commissions</span></nav>
          <p class="eyebrow">Commission Sheet</p>
          <h1 class="page-h1">Commissions</h1>
          <p class="italic-line">Build a modular piece, pick a catalog type, or assemble a bundle — then review and submit.</p>
          <p class="comm-status-badge" data-comm-status>Closed · Next opening: March 2026</p>
        </header>

        <div class="comm-stepper" data-comm-stepper role="navigation" aria-label="Commission steps"></div>
        <div class="comm-progress" data-comm-progress role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><span></span></div>

        <section class="commission-sheet" data-step0>
          <div class="commission-main">
            <div class="comm-tabs" data-comm-tabs role="tablist" aria-label="Catalog"></div>
            <div class="tab-panels" data-tab-panels>
              <div data-panel="builder" role="tabpanel">
                <div data-builder-root></div>
              </div>
              <div data-panel="custom_bundle" role="tabpanel" hidden></div>
              <div data-panel="regular" role="tabpanel" hidden></div>
              <div data-panel="character" role="tabpanel" hidden></div>
              <div data-panel="bundle" role="tabpanel" hidden></div>
            </div>
          </div>
          <aside class="comm-sidebar" aria-label="Order summary">
            <div class="order-dock" data-order-summary></div>
          </aside>
        </section>

        <section data-step1 hidden></section>
        <section data-success hidden></section>
        <div class="mobile-cart-bar" data-mobile-bar aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <div class="toast" data-toast role="status"></div>

  <dialog class="comm-dialog" id="dlg-guidelines"></dialog>
  <dialog class="comm-dialog" id="dlg-tos"></dialog>
  <dialog class="comm-dialog" id="dlg-surprise"></dialog>

  <script src="js/main.js"></script>
  <script src="js/site-data.js"></script>
  <script src="js/commission-data.js"></script>
  <script src="js/commissions.js"></script>
  <script>
    (function () {
      localStorage.setItem("home-profile-mode", "artist");
      document.body.dataset.profile = "artist";
      document.querySelectorAll("[data-mode-link]").forEach(function (el) {
        el.addEventListener("click", function () {
          localStorage.setItem("home-profile-mode", el.dataset.modeLink);
        });
      });
    })();
  </script>
</body>
</html>
