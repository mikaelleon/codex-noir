<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="images/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="images/favicon-32x32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="images/favicon-16x16.png" sizes="16x16" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
  <link rel="manifest" href="images/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="image" href="images/opt/bg4.webp" type="image/webp" />
  <link rel="preload" as="image" href="images/opt/profile1.webp" type="image/webp" />
  <link rel="preload" as="image" href="images/opt/profile2.webp" type="image/webp" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&family=Cinzel:wght@500;600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/codex-noir.css?v=5" />
  <link rel="stylesheet" href="css/main.css?v=5" />
  <link rel="stylesheet" href="css/character-select.css?v=5" />
  <link rel="stylesheet" href="css/cs-stars.css?v=5" />
  <link rel="stylesheet" href="css/app-shell.css?v=16" />
  <title>Mikaelleon — Codex Noir</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("mikaelleon-theme");
        if (t === "light") {
          document.documentElement.classList.add("light");
          document.documentElement.classList.remove("dark");
        }
      } catch (e) {}
    })();
  </script>
.</head>
<body class="realm-gate" data-profile="artist">
  <div class="site shell-site">
    <main class="site-main">
      <section class="cs-root" data-realm-select data-focused="null" aria-label="Choose a profile">
        <div class="cs-bg cs-bg--drift" aria-hidden="true"></div>
        <div class="cs-stars" aria-hidden="true">
          <div class="cs-stars__layer cs-stars__layer--sm"></div>
          <div class="cs-stars__layer cs-stars__layer--md"></div>
          <div class="cs-stars__layer cs-stars__layer--lg"></div>
        </div>
        <div class="cs-fx" data-cs-fx aria-hidden="true"></div>

        <p class="cs-dialogue cs-dialogue--fade" data-cs-dialogue aria-live="polite">
          <span class="cs-dialogue__text" data-cs-dialogue-text></span><span class="cs-dialogue__caret" aria-hidden="true"></span>
        </p>

        <!-- Vue 3 island: parallax depth cards (CodePen XNMWvQ) -->
        <div id="cs-vue-stage" class="cs-stage"></div>

        <!-- §13 Loading modal → §14 Unlock (continuous) -->
        <div class="cs-modal" data-cs-modal hidden aria-hidden="true" role="status">
          <div class="cs-modal__inner">
            <span class="cs-modal__glyph cs-modal__glyph--shimmer" aria-hidden="true">✦</span>
            <p class="cs-modal__status" data-cs-modal-status></p>
          </div>
        </div>
        <div class="cs-unlock" data-cs-unlock hidden aria-hidden="true">
          <div class="cs-unlock__bloom" aria-hidden="true"></div>
          <div class="cs-unlock__gate" aria-hidden="true"></div>
        </div>
      </section>

      <button type="button" class="realm-reopen" data-realm-reopen>Change realm</button>

      <div class="pf-shell" data-pf-shell data-app-shell>
        <nav class="pf-rail" aria-label="Sections">
          <a class="pf-rail__mark" href="#home" data-pf-nav="home" aria-label="Home">
            <picture class="logo-dark pf-rail__logo">
              <source type="image/webp" srcset="images/opt/mainlogo1.webp" />
              <img src="images/opt/mainlogo1.png" alt="" width="44" height="44" decoding="async" />
            </picture>
            <picture class="logo-light pf-rail__logo">
              <source type="image/webp" srcset="images/opt/mainlogo2.webp" />
              <img src="images/opt/mainlogo2.png" alt="" width="44" height="44" decoding="async" loading="lazy" />
            </picture>
          </a>
          <button type="button" class="pf-rail-btn" data-pf-nav="home" aria-label="Home">
            <span class="pf-glyph" aria-hidden="true">✦</span>Home
          </button>
          <button type="button" class="pf-rail-btn" data-pf-nav="about" aria-label="About">
            <span class="pf-glyph" aria-hidden="true">☰</span>About
          </button>
          <button type="button" class="pf-rail-btn" data-pf-nav="projects" aria-label="Work">
            <span class="pf-glyph" aria-hidden="true">◆</span>Work
          </button>
          <a class="pf-rail-btn pf-rail-comm" href="commissions.html" aria-label="Commissions">
            <span class="pf-glyph" aria-hidden="true">✎</span>Commissions
          </a>
          <button type="button" class="pf-rail-btn" data-pf-nav="contact" aria-label="Contact">
            <span class="pf-glyph" aria-hidden="true">✉</span>Contact
          </button>
          <div class="pf-rail__tools">
            <button type="button" class="pf-theme" data-theme-toggle aria-label="Switch to light mode" aria-pressed="false">
              <span data-theme-icon aria-hidden="true">☾</span>
            </button>
            <div class="pf-mode" role="group" aria-label="Profile mode">
              <button type="button" class="pf-mode-btn" data-pf-mode="developer" aria-pressed="false">Dev</button>
              <button type="button" class="pf-mode-btn" data-pf-mode="artist" aria-pressed="false">Art</button>
            </div>
          </div>
        </nav>

        <div class="pf-main">
          <div class="pf-live" data-pf-live aria-live="polite"></div>

          <!-- HOME — Portfolio Unlocked (scroll) -->
          <section class="pf-view pf-scroll active" data-pf-view="home" aria-label="Home">
            <div class="pf-page" data-pf-home></div>
          </section>

          <!-- ABOUT — full story page -->
          <section class="pf-view pf-scroll" data-pf-view="about" aria-label="About">
            <div class="pf-page" data-pf-about></div>
          </section>

          <!-- WORK — list/detail (dev) or gallery (art) -->
          <section class="pf-view pf-work" data-pf-view="projects" aria-label="Work">
            <div class="pf-work-dev pf-ld pf-ld--projects" data-pf-work-dev>
              <div class="pf-list-col">
                <div class="pf-list-head">Projects</div>
                <div role="listbox" aria-label="Projects" data-pf-project-list></div>
              </div>
              <div class="pf-detail-col">
                <button type="button" class="pf-back" data-pf-back="projects">← Back</button>
                <div data-pf-project-detail></div>
              </div>
              <aside class="pf-media-col" aria-label="Project media" data-pf-project-media></aside>
            </div>
            <div class="pf-work-art pf-scroll" data-pf-work-art>
              <div class="pf-page" data-pf-gallery></div>
            </div>
          </section>

          <!-- CONTACT -->
          <section class="pf-view pf-scroll" data-pf-view="contact" aria-label="Contact">
            <div class="pf-page" data-pf-contact></div>
          </section>
        </div>
      </div>
    </main>
    <div class="toast" data-toast role="status"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js" defer></script>
  <script src="js/main.js?v=7" defer></script>
  <script src="js/site-data.js?v=14" defer></script>
  <script src="js/cs-vue.js?v=7" defer></script>
  <script src="js/character-select.js?v=7" defer></script>
  <script src="js/app-shell.js?v=15" defer></script>
</body>
</html>
